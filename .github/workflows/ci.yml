name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # Or the version you are using
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          my-app/package-lock.json

    - name: Build Backend
      working-directory: ./backend
      env:
        # Mock environment variables for env.ts checks
        PORT: 5000
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
        NODE_ENV: "test"
        BREVO_API_KEY: "test"
        EMAIL_FROM: "test@example.com"
        BREVO_TEMPLATE_ID: "1"
        JWT_ACCESS_SECRET: "test-secret"
        JWT_ACCESS_EXPIRE: "1h"
        JWT_REFRESH_SECRET: "test-secret"
        JWT_REFRESH_EXPIRE: "7d"
        JWT_OTP_SECRET: "test-secret"
        JWT_OTP_EXPIRE: "5m"
        JWT_PASSWORD_RESET_SECRET: "test-secret"
        JWT_PASSWORD_RESET_EXPIRE: "1h"
        JWT_INVITE_SECRET: "test-secret"
        JWT_INVITE_EXPIRE: "7d"
        PAYSTACK_SECRET_KEY: "sk_test_123"
        R2_ACCOUNT_ID: "test"
        R2_ACCESS_KEY_ID: "test"
        R2_SECRET_ACCESS_KEY: "test"
        R2_BUCKET: "test"
        R2_PUBLIC_BASE_URL: "http://localhost"
        MONGODB_URI: "mongodb://localhost:27017/test"
      run: |
        npm install --no-fund --no-audit
        npx prisma generate
        npm run build

    - name: Build Frontend
      working-directory: ./my-app
      env:
        # Mock environment variables for frontend Next.js build
        NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
        NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: "pk_test_123"
      run: |
        npm install --no-fund --no-audit
        npm run build
